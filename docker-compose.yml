services:
  fpv:
    build: .
    image: fpv-drone-bot:latest
    container_name: fpv-drone-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/storage/fpv.db
      PORT: "8000"
    # Наружу не публикуется: только localhost, дальше — SSH-туннель на VPS (deploy/).
    ports:
      - "127.0.0.1:8096:8000"
    volumes:
      - ./storage:/app/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
