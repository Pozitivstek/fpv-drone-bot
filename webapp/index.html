<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070d">
  <title>FPV-Drons</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Russo+One&display=swap">
  <link rel="stylesheet" href="css/base.css?v=1">
  <link rel="stylesheet" href="css/screens.css?v=1">
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <header class="topbar hidden" id="topbar"></header>
  <main class="app" id="app">
    <div class="splash">
      <div class="splash-osd">
        <div class="splash-logo">FPV<span>·</span>DRONS</div>
        <div class="splash-line mono">ARMING<span class="dots"></span></div>
      </div>
    </div>
  </main>
  <nav class="tabbar hidden" id="tabbar" aria-label="Разделы">
    <button class="tab" data-tab="/home"><span class="ic" data-icon="home"></span>База</button>
    <button class="tab" data-tab="/cases"><span class="ic" data-icon="case"></span>Кейсы</button>
    <button class="tab" data-tab="/hangar"><span class="ic" data-icon="drone"></span>Ангар</button>
    <button class="tab" data-tab="/race"><span class="ic" data-icon="gate"></span>Гонки</button>
    <button class="tab" data-tab="/workshop"><span class="ic" data-icon="flask"></span>Мастерская</button>
  </nav>
  <div id="layer"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
